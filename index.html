*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--t);font:16px/1.2 'PikselPL','Press Start 2P',monospace;-webkit-font-smoothing:none;overscroll-behavior:none}
#app{display:flex;flex-direction:column;height:100dvh;position:relative;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
@keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.bar{display:flex;align-items:center;padding:4px 6px;background:var(--p);box-shadow:inset 0 2px 0 #3a3a48,0 2px 0 var(--d);position:relative;z-index:3}
.b{font:inherit;color:var(--t);background:var(--c);border:0;margin:2px;min-width:40px;min-height:40px;padding:0 2px;display:flex;align-items:center;justify-content:center;touch-action:manipulation;cursor:pointer;border-radius:0;text-shadow:2px 2px 0 rgba(0,0,0,.55);box-shadow:var(--ol),inset 2px 2px 0 var(--hi),inset -2px -2px 0 var(--lo)}
.b:active{background:#2f2f3b;transform:translateY(2px);box-shadow:var(--ol),inset 2px 2px 0 var(--lo),inset -2px -2px 0 #4d4d63}
.b.on,.b.on:active{background:var(--a);color:#241a0e;text-shadow:none;box-shadow:var(--ol),inset 2px 2px 0 #ffd6a0,inset -2px -2px 0 #b36a1c}
.pl{padding:0 10px;color:var(--a)}
.ic{display:block;width:32px;height:32px;background:currentColor;-webkit-mask:var(--m) center/100% 100%;mask:var(--m) center/100% 100%}
.sp{flex:1}
#cvw{flex:1;position:relative;min-height:0;margin:2px 0;overflow:hidden;background-color:#14141a;background-image:conic-gradient(#1b1b23 25%,transparent 0 50%,#1b1b23 0 75%,transparent 0);background-size:16px 16px}
#cvw::after{content:'';position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 0 2px var(--d),inset 4px 4px 0 rgba(0,0,0,.3)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
#inf{position:absolute;left:0;right:0;bottom:0;z-index:1;font-size:8px;line-height:1.6;color:#c8c8d4;background:#0b0b10;padding:5px 8px;white-space:pre;pointer-events:none;box-shadow:inset 0 2px 0 #2b2b36}
#inf b{color:var(--a);font-weight:400}
#bt{flex:none;display:flex;flex-direction:column;gap:4px;padding:4px 6px 6px;background:var(--p);box-shadow:inset 0 2px 0 #3a3a48,0 -2px 0 var(--d);position:relative;z-index:3}
.wrap{width:100%;max-width:480px;margin:0 auto}
#sr{display:flex;align-items:center;gap:8px;padding:0 2px}
#cs{flex:none;margin:0;min-width:32px;min-height:32px;width:32px;box-shadow:var(--ol),inset 2px 2px 0 rgba(255,255,255,.3),inset -2px -2px 0 rgba(0,0,0,.35)}
#sl,#lo{-webkit-appearance:none;appearance:none;flex:1;height:28px;background:transparent;margin:0 4px;min-width:0}
#sl::-webkit-slider-runnable-track,#lo::-webkit-slider-runnable-track{height:8px;background:linear-gradient(to right,var(--a) var(--v,0%),#13131a var(--v,0%));box-shadow:var(--ol)}
#sl::-webkit-slider-thumb,#lo::-webkit-slider-thumb{-webkit-appearance:none;box-sizing:border-box;width:16px;height:28px;margin-top:-10px;background:#dcdce6;border:0;border-radius:0;box-shadow:var(--ol),inset 2px 2px 0 #fff,inset -2px -2px 0 #8a8aa0}
#sl::-moz-range-track,#lo::-moz-range-track{height:8px;background:#13131a;box-shadow:var(--ol)}
#sl::-moz-range-progress,#lo::-moz-range-progress{height:8px;background:var(--a)}
#sl::-moz-range-thumb,#lo::-moz-range-thumb{box-sizing:border-box;width:16px;height:28px;background:#dcdce6;border:0;border-radius:0;box-shadow:var(--ol),inset 2px 2px 0 #fff,inset -2px -2px 0 #8a8aa0}
#sv{flex:none;width:44px;text-align:right;font-size:8px;text-shadow:2px 2px 0 #000}
.pw{container-type:inline-size}
#pn{display:grid;grid-template-columns:auto auto;justify-content:center;gap:6px;--s:calc((100cqw - 30px)/10)}
#pr,#tl{--ol:0 0 0 0 transparent;display:grid;gap:2px;padding:2px;background:var(--d);min-width:0;grid-auto-rows:var(--s)}
#pr{grid-template-columns:repeat(6,var(--s));max-height:calc(var(--s)*4 + 10px);overflow-y:auto;scrollbar-width:none}
#pr::-webkit-scrollbar{display:none}
#tl{grid-template-columns:repeat(4,var(--s))}
#pr .b,#tl .b{margin:0;min-width:0;min-height:0;padding:0}
#tl .ic{width:84%;height:84%}
.sw{aspect-ratio:1;box-shadow:inset 2px 2px 0 rgba(255,255,255,.28),inset -2px -2px 0 rgba(0,0,0,.32)}
.sw:active{transform:none}
.sw.sel{box-shadow:inset 0 0 0 2px #fff,inset 0 0 0 4px #000}
.sw .ic{width:70%;height:70%}
.drop{position:absolute;top:100%;left:2px;margin-top:6px;z-index:6;background:var(--p);padding:6px;display:flex;flex-direction:column;gap:2px;width:max-content;box-shadow:var(--ol),6px 6px 0 rgba(0,0,0,.45);animation:pop .15s steps(3)}
.drop .b{justify-content:flex-start;padding:0 10px;font-size:10px}
.sheet{position:absolute;right:8px;top:64px;width:290px;max-height:55%;overflow:auto;z-index:4;background:var(--p);padding:8px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--ol),6px 6px 0 rgba(0,0,0,.45);animation:pop .15s steps(3)}
.sheet::-webkit-scrollbar{display:none}
.row{display:flex}.nm{flex:1;min-width:0;justify-content:flex-start;padding:0 6px;font-size:10px}.nm span{line-height:1.7;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;margin-left:8px}.hid .ic{opacity:.35}
.th{width:32px;height:32px;flex:none;image-rendering:pixelated;object-fit:contain;background:repeating-conic-gradient(#555566 0 25%,#3c3c4a 0 50%) 0 0/8px 8px;box-shadow:0 0 0 2px var(--d)}
.modal{position:absolute;inset:0;background:rgba(5,5,10,.7);display:flex;align-items:center;justify-content:center;z-index:9}
.box{background:var(--p);padding:14px;display:flex;flex-direction:column;gap:10px;width:min(320px,92%);box-shadow:var(--ol),8px 8px 0 rgba(0,0,0,.5);animation:pop .15s steps(3)}
.box>div:first-child{color:var(--a);text-shadow:2px 2px 0 #000;padding-bottom:8px;border-bottom:2px solid #13131a}
.box label{font-size:8px;color:#aeaec0}
.box .b{font-size:10px}
input[type=text],input[type=number]{-webkit-user-select:text;user-select:text;font:inherit;font-size:12px;color:var(--t);width:calc(100% - 4px);margin:2px;min-height:40px;background:#13131a;border:0;padding:4px 8px;border-radius:0;box-shadow:var(--ol),inset 2px 2px 0 #000}
.toast{position:absolute;left:0;right:0;margin:auto;width:max-content;max-width:92%;bottom:34px;background:var(--p);padding:10px 14px;box-shadow:var(--ol),4px 4px 0 rgba(0,0,0,.5);font-size:8px;z-index:20;pointer-events:none;animation:pop .15s steps(3)}
#pv{position:absolute;left:8px;top:8px;z-index:1;pointer-events:none;box-shadow:var(--ol),4px 4px 0 rgba(0,0,0,.45);background:repeating-conic-gradient(#555566 0 25%,#3c3c4a 0 50%) 0 0/8px 8px;image-rendering:pixelated}
.bar::after,#bt::before{content:'';position:absolute;left:0;right:0;height:4px;pointer-events:none;background:conic-gradient(#0b0b10 25%,transparent 0 50%,#0b0b10 0 75%,transparent 0) 0 0/4px 4px;opacity:.55}
.bar::after{bottom:-6px}#bt::before{top:-6px}
.b.pl{letter-spacing:1px}.drop{max-height:70vh;overflow:auto}
#hm{position:absolute;inset:0;z-index:8;overflow:auto;background:#1a1a22;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
@keyframes bl{50%{opacity:0}}
.hh{padding:26px 14px 4px;text-align:center}.logo{font-size:22px;color:var(--a);text-shadow:2px 2px 0 #b36a1c,4px 4px 0 #0b0b10;letter-spacing:2px}.sub{font-size:8px;color:#aeaec0;margin-top:16px}.cu{color:var(--a);animation:bl 1s steps(1) infinite}
#wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:22px 16px;padding:22px 16px 48px;max-width:780px;margin:0 auto}
.fr{display:flex;flex-direction:column;gap:5px;position:relative;font:inherit;color:var(--t)}.fr:nth-child(even){margin-top:14px}
.fr:not(.add)::before{content:'';position:absolute;top:-9px;left:calc(50% - 3px);width:6px;height:6px;background:#9badb7;box-shadow:0 0 0 2px var(--d)}
.mt{border:0;padding:9px;aspect-ratio:1;width:100%;display:block;cursor:pointer;background:#8f563b;box-shadow:0 0 0 2px var(--d),inset 2px 2px 0 #c07a54,inset -2px -2px 0 #5c3322,6px 6px 0 rgba(0,0,0,.5)}.mt:active{transform:translateY(2px)}
.mt img{display:block;width:100%;height:100%;object-fit:contain;image-rendering:pixelated;background:repeating-conic-gradient(#555566 0 25%,#3c3c4a 0 50%) 0 0/8px 8px;box-shadow:0 0 0 2px #2a1710}
.plq{background:#d9a066;color:#241a0e;font-size:8px;line-height:1.7;padding:4px 6px;margin-top:6px;text-align:center;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;box-shadow:0 0 0 2px var(--d),inset 2px 2px 0 #eec39a,inset -2px -2px 0 #a8743f}
.meta{font-size:8px;color:#8a8aa0;text-align:center}.fr .b{flex:1;min-height:30px}.fr .ic{width:20px;height:20px}
.add{aspect-ratio:1;align-self:start;background:rgba(0,0,0,.25);border:4px dashed #5a5a72;justify-content:center;align-items:center;gap:12px;color:var(--a);cursor:pointer;padding:0}.add:active{border-color:var(--a)}.pls{font-size:40px;line-height:1}.add span{font-size:8px;color:#aeaec0}

[hidden]{display:none!important}

const pt=e=>{const r=cv.getBoundingClientRect(),k=cv.width/r.width;return{x:(e.clientX-r.left)*k,y:(e.clientY-r.top)*k}};
const ax=p=>Math.floor((p.x-ox)/z),ay=p=>Math.floor((p.y-oy)/z),P=new Map();
cv.oncontextmenu=e=>e.preventDefault();
cv.onpointerdown=e=>{cv.setPointerCapture(e.pointerId);const p=pt(e);P.set(e.pointerId,p);
 if(P.size==2){if(st){if(st.t!='pick'&&st.t!='sel')restore(hist.pop());st=null}pan=null;hv=null;blocked=true;const[a,b]=[...P.values()],m={x:(a.x+b.x)/2,y:(a.y+b.y)/2};g={d0:Math.hypot(a.x-b.x,a.y-b.y)||1,z0:z,ax:(m.x-ox)/z,ay:(m.y-oy)/z};return}
 if(P.size>2||blocked)return;
 if(tool=='hand'){pan={x:p.x,y:p.y,ox,oy};return}
 const x=ax(p),y=ay(p);hv={x,y};
 if(tool=='pick'){st={t:'pick'};pickC(x,y);render();return}
 if(tool=='sel'){st={t:'sel',sx:x,sy:y,x,y};setSel(st);render();return}
 if(tool=='move'){push();st={t:'move',sx:x,sy:y,base:layers[cur].d.slice(),sb:sel?{...sel}:null};return}
 push();
 if(tool=='fill'){if(!flood(x,y))hist.pop();else persist();render();return}
 st={t:tool,sx:x,sy:y,lx:x,ly:y,x,y,pts:[[x,y]],base:layers[cur].d.slice()};
 if(tool=='pen'||tool=='era')plot(x,y,tool=='era');
 else shape();
 render()};
cv.onpointermove=e=>{const p=pt(e),x=ax(p),y=ay(p);
 if(!P.has(e.pointerId)){if(e.pointerType=='mouse'){hv={x,y};render()}return}
 P.set(e.pointerId,p);
 if(P.size==2&&g){const[a,b]=[...P.values()],m={x:(a.x+b.x)/2,y:(a.y+b.y)/2},d=Math.hypot(a.x-b.x,a.y-b.y);
  z=Math.max(1,Math.min(64,Math.round(g.z0*d/g.d0)));ox=Math.round(m.x-g.ax*z);oy=Math.round(m.y-g.ay*z);render();return}
 if(P.size>1||blocked)return;
 if(pan){ox=Math.round(pan.ox+p.x-pan.x);oy=Math.round(pan.oy+p.y-pan.y);render();return}
 if(!st)return;hv={x,y};
 if(st.t=='pick'){pickC(x,y);return}
 if(st.t=='pen'||st.t=='era'){line(st.lx,st.ly,x,y,(a,b)=>st.t=='pen'?ppp(a,b):plot(a,b,true));st.lx=x;st.ly=y}
 else if(st.t=='sel'){st.x=x;st.y=y;setSel(st)}
 else if(st.t=='move')mv(x-st.sx,y-st.sy);
 else{st.x=x;st.y=y;shape()}
 render()};
cv.onpointerup=cv.onpointercancel=e=>{P.delete(e.pointerId);if(P.size<2)g=null;if(!P.size){if(st&&st.t=='sel'&&st.sx==st.x&&st.sy==st.y)sel=null;if(st&&st.t!='pick'&&st.t!='sel')persist();st=null;pan=null;blocked=false;if(e.pointerType!='mouse')hv=null;render()}};
cv.onpointerleave=e=>{if(e.pointerType=='mouse'&&!P.size){hv=null;render()}};
cv.onwheel=e=>{e.preventDefault();const p=pt(e),a=(p.x-ox)/z,b=(p.y-oy)/z;z=Math.max(1,Math.min(64,z+(e.deltaY<0?1:-1)));ox=Math.round(p.x-a*z);oy=Math.round(p.y-b*z);render()};
new ResizeObserver(()=>{if(layers){size();render()}}).observe($('#cvw'));
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;($('#hm').hidden?$('#cvw'):$('#hm')).appendChild(t);setTimeout(()=>t.remove(),1900)}
const dl=(blob,n)=>{toast('Zapisano: '+n);const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)};
const loadImg=s=>new Promise((r,j)=>{const i=new Image();i.onload=()=>r(i);i.onerror=j;i.src=s});
const k8=()=>Math.max(1,Math.min(8,Math.floor(4096/Math.max(w,h))));
function menuLbl(){$('#mt').textContent='Kafelki: '+(tile?'wł.':'wył.');$('#mp').textContent='Pixel-perfect: '+(ppOn?'wł.':'wył.');const k=k8();$('#p1').textContent='PNG '+w+'x'+h+' (oryginał)';$('#p8').textContent='PNG '+w*k+'x'+h*k+' (powiększony '+k+'x)';$('#p8').hidden=k<2}
function pngOut(k){comp();const c=mkc(w*k,h*k),q=c.getContext('2d');q.imageSmoothingEnabled=false;q.drawImage(off,0,0,w*k,h*k);c.toBlob(b=>dl(b,'obraz.png'))}
function proj(){return{app:'pikselarnia',w,h,pal:PAL,layers:layers.map(l=>{tg.putImageData(new ImageData(l.d,w,h),0,0);return{n:l.n,v:l.v,o:l.o,png:tmp.toDataURL()}})}}
function save(){dl(new Blob([JSON.stringify(proj())],{type:'application/json'}),'projekt.json')}
let db,pid=null,pname='',LIST=[],arm=null;
const idb=()=>new Promise((r,j)=>{const q=indexedDB.open('pikselarnia',1);q.onupgradeneeded=()=>q.result.createObjectStore('p',{keyPath:'id'});q.onsuccess=()=>r(q.result);q.onerror=j});
const tx=(m,f)=>new Promise(r=>{const t=db.transaction('p',m),o=f(t.objectStore('p'));t.oncomplete=()=>r(o.result)});
const esc=t=>t.replace(/[&<>"]/g,c=>'&#'+c.charCodeAt(0)+';');
function persist(){clearTimeout(pT);pT=setTimeout(saveNow,700)}
async function saveNow(){if(!pid||!layers||!db)return;comp();let k=Math.min(96/w,96/h);if(k>=1)k=Math.floor(k);const c=mkc(Math.max(1,Math.round(w*k)),Math.max(1,Math.round(h*k))),q=c.getContext('2d');q.imageSmoothingEnabled=false;q.drawImage(off,0,0,c.width,c.height);await tx('readwrite',s=>s.put({...proj(),id:pid,name:pname,t:Date.now(),th:c.toDataURL()}))}
function drawHome(){const n=LIST.length;$('#hm').innerHTML=`<div class="hh"><div class="logo">PIXELSPRITE</div><div class="sub">PROJEKTY: ${n}</div></div><div id="wall"><button class="fr add" data-a="new"><div class="pls">+</div><span>NOWA PRACA</span></button>${LIST.map(r=>`<div class="fr"><button class="mt" data-o="${r.id}"><img src="${r.th}" alt=""></button><div class="plq">${esc(r.name)}</div><div class="meta">${r.w}x${r.h} · ${new Date(r.t).toLocaleDateString('pl',{day:'2-digit',month:'2-digit'})}</div><div class="row"><button class="b" data-dup="${r.id}" aria-label="Duplikuj">${ic('dup')}</button><button class="b" data-rm="${r.id}" aria-label="Usuń">${ic('del')}</button></div></div>`).join('')}</div>`}
async function home(){clearTimeout(pT);await saveNow();pid=null;LIST=(await tx('readonly',s=>s.getAll())).sort((a,b)=>b.t-a.t);drawHome();$('#hm').hidden=false}
async function openP(id){const r=await tx('readonly',s=>s.get(id));if(!r)return;pid=id;pname=r.name;await loadProj(r);$('#hm').hidden=true}
async function newP(W,H){pid='p'+Date.now();pname='Praca '+(LIST.length+1);mk(W,H);await saveNow();$('#hm').hidden=true}
async function dupP(id){const r=LIST.find(x=>x.id==id);await tx('readwrite',s=>s.put({...r,id:'p'+Date.now(),name:r.name.slice(0,22)+'+',t:Date.now()}));home()}
async function rmP(id){if(arm!=id){arm=id;setTimeout(()=>arm=null,2200);toast('Stuknij ponownie, by usunąć');return}arm=null;await tx('readwrite',s=>s.delete(id));home()}
document.addEventListener('visibilitychange',()=>{if(document.hidden)saveNow()});
const px=(im,W,H)=>{const c=mkc(W,H),q=c.getContext('2d');q.drawImage(im,0,0);return q.getImageData(0,0,W,H).data};
async function loadProj(j){const ls=await Promise.all(j.layers.map(async l=>({n:l.n,v:l.v,o:l.o,d:px(await loadImg(l.png),j.w,j.h)})));if(j.pal)PAL=j.pal;mk(j.w,j.h,ls)}
$('#fi').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
 try{if(/\.json$/i.test(f.name)){await loadProj(JSON.parse(await f.text()))}
  else{const u=URL.createObjectURL(f),im=await loadImg(u);if(im.width>256||im.height>256){toast('Maks. 256x256');return}
   mk(im.width,im.height,[{n:'Warstwa 1',v:1,d:px(im,im.width,im.height)}])}}
 catch(x){toast('Nie udało się otworzyć pliku')}};
$('#ci').oninput=e=>{col=rgb(e.target.value);ui()};$('#ci').onchange=e=>{if(!PAL.includes(e.target.value))PAL.push(e.target.value);ui()};
$('#lo').oninput=e=>{layers[cur].o=e.target.value/100;e.target.style.setProperty('--v',e.target.value+'%');render();persist()};
$('#sl').oninput=e=>setBs(+e.target.value);
let rnI=-1;
function openRn(i){rnI=i;$('#rtt').textContent=i==-3?'Nazwa palety':i<0?'Nazwa pracy':'Nazwa warstwy';$('#rt').value=i==-3?'Moja paleta':i<0?pname:layers[i].n;$('#rn').hidden=false;setTimeout(()=>{$('#rt').focus();$('#rt').select()},50)}
function doRn(){const v=$('#rt').value.trim().slice(0,24);if(v){if(rnI==-3)addCP(v);else if(rnI<0)pname=v;else if(layers[rnI])layers[rnI].n=v}$('#rn').hidden=true;ui()}
$('#rt').onkeydown=e=>{e.stopPropagation();if(e.key=='Enter')doRn();if(e.key=='Escape')$('#rn').hidden=true};
document.addEventListener('click',e=>{
 navigator.vibrate&&e.target.closest('button')&&navigator.vibrate(6);
 if(!e.target.closest('#mf,[data-a=menu]'))$('#mf').hidden=true;
 const t=e.target.closest('button');if(!t)return;const d=t.dataset;
 if(d.t){tool=d.t;ui();return}
 if(d.c){col=rgb(PAL[d.c]);ui();return}
 if(d.v){layers[d.v].v=layers[d.v].v?0:1;ui();return}
 if(d.s){cur=+d.s;ui();return}
 if(d.rn){openRn(+d.rn);return}
 if(d.p){$('#nw').value=$('#nh').value=d.p;document.querySelectorAll('[data-p]').forEach(b=>b.classList.toggle('on',b==t));return}
 if(d.pp){const p=allP()[+d.pp];PAL=p.c.slice();col=rgb(PAL[0]);$('#ps').hidden=true;ui();toast('Paleta: '+p.n);return}
 if(d.pd){CP.splice(+d.pd,1);saveCP();palUI();return}
 if(d.o){openP(d.o);return}if(d.dup){dupP(d.dup);return}if(d.rm){rmP(d.rm);return}
 const a=d.a;if(!a)return;
 if(a=='menu'){menuLbl();$('#mf').hidden=!$('#mf').hidden}
 else $('#mf').hidden=true;
 if(a=='new')$('#dg').hidden=false;
 if(a=='no')$('#dg').hidden=true;
 if(a=='rok')doRn();
 if(a=='rno')$('#rn').hidden=true;
 if(a=='ok'){const W=Math.max(1,Math.min(256,+$('#nw').value||32)),H=Math.max(1,Math.min(256,+$('#nh').value||32));$('#dg').hidden=true;newP(W,H)}
 if(a=='home')home();
 if(a=='rnp')openRn(-2);
 if(a=='open')$('#fi').click();
 if(a=='save')save();
 if(a=='png1')pngOut(1);
 if(a=='png8')pngOut(k8());
 if(a=='undo')undo();
 if(a=='redo')redoF();
 if(a=='grid'){grid=!grid;ui()}
 if(a=='fit')fit();
 if(a=='fm'){fm=!fm;ui();toast(fm?'Wypełnione kształty: wł.':'Wypełnione kształty: wył.')}
 if(a=='mir'){mir=!mir;ui();toast(mir?'Symetria: wł.':'Symetria: wył.')}
 if(a=='clr')clr();
 if(a=='tile'){tile=!tile;render()}
 if(a=='ppt')ppOn=!ppOn;
 if(a=='ol')outline();
 if(a=='rot')rot();
 if(a=='pal')palCyc();
 if(a=='lay'){$('#sh').hidden=!$('#sh').hidden;$('#ps').hidden=true}
 if(a=='pals'){palUI();$('#ps').hidden=!$('#ps').hidden;$('#sh').hidden=true}
 if(a=='psave')openRn(-3);
 if(a=='pimg')fromImg();
 if(a=='padd')$('#ci').click();
 if(a=='fliph'||a=='flipv')flip(a=='fliph');
 if(a=='ladd'){push();layers.push({n:'Warstwa '+(++nc),v:1,d:new Uint8ClampedArray(w*h*4)});cur=layers.length-1;ui()}
 if(a=='ldup'){push();const l=layers[cur];layers.splice(cur+1,0,{n:l.n+'+',v:1,o:l.o,d:l.d.slice()});cur++;ui()}
 if(a=='ldel'&&layers.length>1){push();layers.splice(cur,1);cur=Math.max(0,cur-1);ui()}
 if(a=='lup'&&cur<layers.length-1){push();[layers[cur],layers[cur+1]]=[layers[cur+1],layers[cur]];cur++;ui()}
 if(a=='ldn'&&cur>0){push();[layers[cur],layers[cur-1]]=[layers[cur-1],layers[cur]];cur--;ui()}
});
addEventListener('keydown',e=>{if(e.target.tagName=='INPUT'||!$('#hm').hidden)return;const k=e.key.toLowerCase(),m=e.ctrlKey||e.metaKey;
 if(m&&k=='z'){e.preventDefault();e.shiftKey?redoF():undo();return}
 if(m&&k=='y'){e.preventDefault();redoF();return}
 if(m&&k=='s'){e.preventDefault();save();return}
 if(m||e.altKey)return;
 const T={b:'pen',e:'era',g:'fill',i:'pick',l:'line',r:'rect',o:'ell',t:'tri',m:'sel',v:'move',h:'hand'};
 if(T[k]){tool=T[k];ui()}
 else if(k=='[')setBs(bs-1);else if(k==']')setBs(bs+1);
 else if(k=='x'){mir=!mir;ui()}else if(k=='f'){fm=!fm;ui()}else if(k=='#'){grid=!grid;ui()}
 else if(k=='delete'||k=='backspace')clr()});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
setBs(1);
(async()=>{db=await idb();mk(64,64);let L=await tx('readonly',s=>s.getAll());
 if(!L.length){let o=null;try{o=JSON.parse(localStorage.getItem('pikselarnia.v2'))}catch(e){}
  if(o&&o.layers){try{await loadProj(o);pid='p'+Date.now();pname='Stara praca';await saveNow();localStorage.removeItem('pikselarnia.v2')}catch(e){}}}
 home()})();
